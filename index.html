    <meta name="keywords" content="APX Digital, digital agency, website development, app development, AI solutions, branding, UI UX design, Ayush Gupta, Prince Singh, Komal Soni" />

    <!-- Open Graph / Social Media -->

    <meta property="og:url" content="https://apxdigital.in/" />
    <meta property="og:title" content="APX DIGITAL — Build. Create. Innovate." />
    <meta property="og:description" content="We turn ideas into digital experiences. Modern digital agency delivering technology-driven and creative digital solutions." />
    <meta property="og:image" content="/brand/logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="/brand/logo.svg" />

    <!-- Modern Typography: Plus Jakarta Sans, Outfit & International Scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Color Scheme & FOUC Prevention Script -->
    <meta name="color-scheme" content="dark light">
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('apx_theme');
          const theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.querySelector('meta[name="color-scheme"]').content = theme === 'dark' ? 'dark' : 'light';
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
